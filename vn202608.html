# 🇻🇳 峴港行程計畫
### 2026研討漫遊(V22)

## 🎒 準備頁 (Preparation)

### ✈️ 去程機票資訊
| 航班 | 航線 | 座位 | 行李額度 |
| :--- | :--- | :--- | :--- |
| 🐯 **台灣虎航** (去程) | 台北 (TPE) ➔ 峴港 (DAD) | **待排** | **晴**：無託運行李<br>**李**：15 公斤託運 + 優先 |

> ⚠️ **虎航手提行李嚴格規範：**
> *   **件數：** 1 件手提行李 + 1 件個人隨身物品，合計共 **2 件**。
> *   **尺寸：** 長 54 x 寬 38 x 高 23 公分（含輪子及手把等外部突出物）。
> *   **重量：** 手提與隨身物品合計不可超過 **10 公斤**。

### ☑️ 行前核取清單 (Checklist)
*文件與財務*
- [ ] 護照（確認效期大於六個月）與紙本電子簽證 (e-Visa)
- [ ] 信用卡（已綁定相關 Pay）與 越南盾/美金現鈔
- [ ] 網卡 / eSIM 憑證
- [ ] 旅遊平安險 / 不便險投保證明

*衣物與日常*
- [ ] 夏日衣物（可以多帶幾套適合「淨春型」的高對比亮色系、暖色調服飾，在峴港海邊拍照會非常亮眼！）
- [ ] 薄外套（機上與冷氣房防曬保暖）
- [ ] 泳裝、泳具（兩間飯店皆有泳池，必備！）
- [ ] 盥洗包、個人常備藥品、高係數防曬乳
- [ ] 隨身安撫小物或頸枕（搭機用）

## 🗺️ 行程總覽 (Itinerary)

### **Day 1：抵達與放鬆**
*   **13:00** 抵達峴港國際機場 (DAD)
    *   `[🚗 交通：預約機場接送 / Grab]` ➔ 前往飯店
*   **14:00** 飯店 A Check-in
